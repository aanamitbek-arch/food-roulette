<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <title>Food Roulette PRO 🍽️</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gradient-to-br from-orange-100 to-pink-200 min-h-screen flex flex-col items-center justify-center p-4">

<h1 class="text-3xl font-bold mb-4">🍽️ Food Roulette PRO</h1>

<div class="pointer"></div>
<div id="wheel" class="wheel mb-6"></div>

<button onclick="spinWheel()" class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-3 rounded-xl mb-2 w-60">
🎲 Айналдыру
</button>

<button onclick="loadNearby()" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-xl mb-4 w-60">
📍 Жақын ресторандар
</button>

<div id="result" class="text-xl font-semibold mb-4 text-center"></div>

<div id="card" class="bg-white rounded-xl shadow p-4 w-80 hidden">
  <img id="img" class="rounded-lg mb-2 w-full h-40 object-cover">
  <h2 id="name" class="font-bold text-lg"></h2>
  <p id="rating"></p>
  <p id="price"></p>
</div>

<div class="mt-6 w-80">
  <h2 class="font-bold">📜 History:</h2>
  <ul id="history"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
